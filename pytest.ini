[pytest]
testpaths = tests
addopts = -ra -m "not production_units_legacy and not debug_pu_delete"
markers =
  e2e: UI end-to-end tests
  parameters: machine parameters UI tests
  production_units_legacy: старые UI-тесты ProductionUnits (временно исключены из прогона)
  production_units_crud: новый CRUD-сценарий ProductionUnitsCRUD
  devices_crud: новый CRUD-сценарий DevicesCRUD
  debug_pu_delete: временная отладка удаления production unit (запуск вручную)

